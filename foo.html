<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Foo</title>
	<style>
		a {
			border: 1px solid orange;
			cursor: pointer;
		}

		details {
		  display: flex;
		  height: 100%;
		  position: relative;
		}

		details.open > summary::before {
		  transform: rotate(90deg);
		}

		details #items {
		  max-height: 0;
		  height: auto;
		}

		details.open #items {
		  max-height: 100svh;
		}

		[type="dropdown"] > details {
		  flex-direction: column;
		}

		[type="dropdown"] > details > #items {
		  flex-direction: column;
		  position: absolute;
		  top: 100%;
		}

		summary {
		  align-items: center;
		  cursor: pointer;
		  display: flex;
		  padding: 0 var(--amenu-pad, .5rem);
		  height: 100%;
		}

		summary::before {
		  align-items: center;
		  content: "▶";
		  display: inline-flex;
		  justify-content: center;
		  transition: transform .25s;
		}

		#items {
		  border: 1px solid lime;
		  align-items: stretch;
		  display: flex;
		  overflow: hidden;
		  display: flex;
		  justify-content: var(--amenu-flex, center);
		  transition:
		    height var(--amenu-duration, 400ms) ease-in-out,
		    max-height var(--amenu-duration, 400ms) ease-in-out,
		    opacity var(--amenu-duration, 400ms) 200ms;
		}

		#label-wrapper {
		  align-items: center;
		  display: flex;
		  flex: 1;
		}
	</style>
</head>
<body>

<div type="dropdown">
	<details part="menu" id="menu">
    <summary part="summary" id="summary" role="button" aria-expanded="false">
      <div id="label-wrapper">
        <span part="icon" id="icon" class="hidden">
          ?
        </span>
        <span part="label" id="label">
          Label One
        </span>
      </div>
    </summary>

    <div part="items" id="items">
      <a>Foo</a>
      <a>Bar</a>
      <a>Baz</a>
      <a>Boom</a>
    </div>
  </details>
</div>

  <script>
  	const details = document.body.querySelector('details');
  	const summary = details.querySelector('summary');
  	summary.addEventListener('click', (event) => {
  		event.preventDefault();
  		details.classList.toggle('open');
  		if (details.classList.contains('open')) {
  			details.open = true;
  		}
  	});
  </script>
</body>
</html>
