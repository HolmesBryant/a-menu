<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Foo</title>

  <script>
    class FooBar extends HTMLElement {
      #type="foo";

      static template = `
        <style>
          div {
            border: 1px solid lime;
            padding: .5rem;
          }

          #children {
            border: 1px solid black;
          }
        </style>

        <div>
          <select>
            <option>foo</option>
            <option>bar</option>
          </select>

          <div id="children">
            <slot></slot>
          </div>
        </div>
      `;
      constructor() {
        super();
        this.attachShadow({mode:'open'});
      }

      connectedCallback() {
        this.shadowRoot.innerHTML = FooBar.template;
        this.shadowRoot.querySelector('select').addEventListener('change', (event) => {
            const value = event.target.value;
            this.applyTypeToChildren(value);
        });
      }

      applyTypeToChildren(value) {
        const children = Array.from(this.children).filter( item => item.localName === 'foo-bar');
        for (const child of children) {
          child.type = value;
        }
      }

      get type() { return this.#type }
      set type(value) {
        this.#type = value;
        console.log(this.#type, this);
      }
    }

    customElements.define('foo-bar', FooBar);
  </script>
</head>
<body>

  <foo-bar type="foo">
    <foo-bar>
      <foo-bar></foo-bar>
    </foo-bar>
  </foo-bar>

  <p>Fugiat pariatur dolore qui ullamco officia ut veniam velit adipisicing anim ut dolore ex proident exercitation ullamco voluptate commodo sit ut eiusmod ullamco in qui laboris cillum id id anim nulla elit veniam dolore.</p>

</body>
</html>
